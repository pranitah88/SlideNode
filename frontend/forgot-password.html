<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Reset Password - SlideNode AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-fixed": "#dbe1ff",
            "background": "#f8f9fa",
            "on-surface": "#191c1d",
            "on-surface-variant": "#434655",
            "outline-variant": "#c3c6d7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f4f5",
            "success": "#10b981",
            "error": "#ba1a1a"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Geist", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #191c1d; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Geist', sans-serif; }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      animation: floatBlob 16s ease-in-out infinite alternate;
    }
    .blob-1 {
      top: -10%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(219, 225, 255, 0.9) 0%, rgba(37, 99, 235, 0.25) 100%);
    }
    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }
  </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-between relative selection:bg-primary-fixed">

  <div class="bg-blob blob-1"></div>

  <header class="w-full max-w-container-max mx-auto px-6 py-6 flex justify-between items-center z-10">
    <a href="index.html" class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M2 10v3"></path><path d="M6 6v11"></path><path d="M10 3v18"></path><path d="M14 8v7"></path><path d="M18 5v13"></path><path d="M22 10v3"></path></svg>
      <span class="font-display text-2xl font-bold text-primary">SlideNode</span>
    </a>
    <div class="text-xs text-on-surface-variant font-medium">
      Remembered your password? <a href="login.html" class="text-primary font-semibold hover:underline">Log in</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6 z-10">
    <div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-2xl p-8 shadow-xl space-y-6">
      
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-xl bg-primary-fixed text-primary flex items-center justify-center mx-auto mb-3">
          <span class="material-symbols-outlined text-2xl">key</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-on-surface">Reset password</h1>
        <p class="text-on-surface-variant text-sm">Enter your email and we'll send a link to reset your password</p>
      </div>

      <div id="auth-alert-box" class="hidden p-3.5 rounded-xl border text-xs font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-sm" id="auth-alert-icon">info</span>
        <span id="auth-alert-text"></span>
      </div>

      <form id="form-forgot" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Email Address</label>
          <input type="email" id="forgot-email" required class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3.5 text-on-surface text-sm placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="alex@company.com">
        </div>

        <button type="submit" id="btn-forgot-submit" class="w-full bg-primary hover:bg-primary-container text-white py-3.5 rounded-xl font-semibold text-sm shadow-md transition-all flex items-center justify-center gap-2">
          <span>Send Reset Link</span>
          <span class="material-symbols-outlined text-base">send</span>
        </button>
      </form>

      <div class="pt-4 border-t border-outline-variant/60 text-center text-xs text-on-surface-variant">
        Back to <a href="login.html" class="text-primary font-medium hover:underline">Login</a>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-on-surface-variant z-10">
    SlideNode AI • Professional Presentation Architecture
  </footer>

  <script type="module">
    import { auth } from './src/services/auth.ts';
    import { initSpotlightBackground } from './src/services/spotlight.ts';

    document.addEventListener('DOMContentLoaded', () => {
      initSpotlightBackground();
      const form = document.getElementById('form-forgot');
      const emailInput = document.getElementById('forgot-email');
      const submitBtn = document.getElementById('btn-forgot-submit');
      const alertBox = document.getElementById('auth-alert-box');
      const alertText = document.getElementById('auth-alert-text');
      const alertIcon = document.getElementById('auth-alert-icon');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          if (!email) return;

          try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">sync</span> Sending...';

            const res = await auth.resetPassword(email);
            alertBox.classList.remove('hidden');

            if (res.success) {
              alertBox.className = 'p-3.5 rounded-xl bg-success-container text-on-success-container border border-success/30 text-xs font-medium flex items-center gap-2';
              alertIcon.textContent = 'check_circle';
              alertText.textContent = 'Password reset link sent to your email address.';
            } else {
              alertBox.className = 'p-3.5 rounded-xl bg-error/10 text-error border border-error/30 text-xs font-medium flex items-center gap-2';
              alertIcon.textContent = 'error';
              alertText.textContent = res.error || 'Failed to send reset link. Please try again.';
            }
          } catch (err) {
            console.error(err);
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Send Reset Link</span><span class="material-symbols-outlined text-base">send</span>';
          }
        });
      }
    });
  </script>
</body>
</html>
