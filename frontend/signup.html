<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Create Account - SlideNode AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-fixed": "#dbe1ff",
            "background": "#f8f9fa",
            "on-surface": "#191c1d",
            "on-surface-variant": "#434655",
            "outline-variant": "#c3c6d7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f4f5",
            "success": "#10b981",
            "error": "#ba1a1a"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Geist", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #191c1d; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Geist', sans-serif; }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      animation: floatBlob 16s ease-in-out infinite alternate;
    }
    .blob-1 {
      top: -10%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(219, 225, 255, 0.9) 0%, rgba(37, 99, 235, 0.25) 100%);
    }
    .blob-2 {
      bottom: -10%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(225, 224, 255, 0.8) 0%, rgba(99, 102, 241, 0.2) 100%);
      animation-delay: -8s;
    }
    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-blob { animation: none; }
    }
  </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-between relative selection:bg-primary-fixed">

  <!-- Animated background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- Header -->
  <header class="w-full max-w-container-max mx-auto px-6 py-6 flex justify-between items-center z-10">
    <a href="index.html" class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M2 10v3"></path><path d="M6 6v11"></path><path d="M10 3v18"></path><path d="M14 8v7"></path><path d="M18 5v13"></path><path d="M22 10v3"></path></svg>
      <span class="font-display text-2xl font-bold text-primary">SlideNode</span>
    </a>
    <div class="text-xs text-on-surface-variant font-medium">
      Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Log in</a>
    </div>
  </header>

  <!-- Signup Card Container -->
  <main class="flex-1 flex items-center justify-center p-6 z-10">
    <div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-2xl p-8 shadow-xl space-y-6 transform transition-all">
      
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-xl bg-primary-fixed text-primary flex items-center justify-center mx-auto mb-3">
          <span class="material-symbols-outlined text-2xl">person_add</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-on-surface">Create an account</h1>
        <p class="text-on-surface-variant text-sm">Start generating executive presentation decks in seconds</p>
      </div>

      <!-- Error Alert Box -->
      <div id="auth-error-box" class="hidden p-3.5 rounded-xl bg-error/10 border border-error/20 text-error text-xs font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">error</span>
        <span id="auth-error-text">An account with this email already exists.</span>
      </div>

      <!-- Signup Form -->
      <form id="form-signup" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Full Name</label>
          <input type="text" id="signup-fullname" required class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3.5 text-on-surface text-sm placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Rahul Sharma">
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Email Address</label>
          <input type="email" id="signup-email" required class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3.5 text-on-surface text-sm placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="rahul@company.com">
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Password (min 8 characters)</label>
          <input type="password" id="signup-password" required minlength="8" class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3.5 text-on-surface text-sm placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••">
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Confirm Password</label>
          <input type="password" id="signup-confirm-password" required minlength="8" class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3.5 text-on-surface text-sm placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••">
        </div>

        <button type="submit" id="btn-signup-submit" class="w-full bg-primary hover:bg-primary-container text-white py-3.5 rounded-xl font-semibold text-sm shadow-md transition-all flex items-center justify-center gap-2">
          <span>Create Account</span>
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </button>
      </form>

      <div class="pt-4 border-t border-outline-variant/60 text-center text-xs text-on-surface-variant">
        By creating an account, you agree to our Terms of Service & Privacy Policy.
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-on-surface-variant z-10">
    SlideNode AI • Voice to Presentation Engine
  </footer>

  <script type="module" src="./src/pages/signup.ts"></script>
</body>
</html>
